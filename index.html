function chart(c){const W=360,H=240,p={l:46,r:12,t:10,b:30};const L=c=='l';const pts=(L?cape.filter(b=>b.type=='Lot'&&b.lot_ac):cape.filter(b=>b.type!='Lot'&&b.sqft)).map(b=>({b,xv:L?+b.lot_ac:+b.sqft}));
if(!pts.length){$('#chart').innerHTML='<div class="note">No data.</div>';return}
const xM=Math.max(...pts.map(q=>q.xv))*1.08,yM=Math.ceil(Math.max(...pts.map(q=>q.b.price))*1.08/1e6)*1e6;const x=v=>p.l+v/xM*(W-p.l-p.r),y=v=>H-p.b-v/yM*(H-p.t-p.b);let g='';
for(let i=0;i<=4;i++){const v=yM*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y(v)}" y2="${y(v)}" stroke="#2c3360"/><text x="${p.l-4}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#9aa0bd">${v?short(v):'$0'}</text>`}
for(let i=0;i<=4;i++){const v=xM*i/4;g+=`<text x="${x(v)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#9aa0bd">${L?v.toFixed(1)+'ac':Math.round(v/100)*100+'sf'}</text>`}
pts.forEach(q=>g+=`<circle cx="${x(q.xv)}" cy="${y(q.b.price)}" r="9" fill="${q.b.type=='House'?'#5b8cff':q.b.type=='Lot'?'#3ccf8e':'#f5b942'}" fill-opacity=".85" stroke="#0f1220" onclick="openD(${q.b.i})" style="cursor:pointer"><title>${esc(q.b.addr)}</title></circle>`);
$('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
$('#cnote').innerHTML=L?`Each dot is an active Gulf-front lot on the Cape ($ vs acreage). Lots are kept off the homes chart because they have no sq ft. Tap a dot for details.`:`Each dot is an active Gulf-front home on the Cape ($ vs heated sq ft): <span style="color:#5b8cff">●</span> house <span style="color:#f5b942">●</span> condo/TH. Lots are on the other tab ($ vs acres). Indian Pass and under-contract listings excluded. Tap a dot for details.`}
